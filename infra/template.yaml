AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Support Triage — support-ticket webhook receiver that triages tickets with Claude.

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
  IssueTrackerApiKey:
    Type: String
    NoEcho: true
  SlackWebhookUrl:
    Type: String
    NoEcho: true

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.12

Resources:
  TriageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/
      Handler: triage.handler.lambda_handler
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ISSUE_TRACKER_API_KEY: !Ref IssueTrackerApiKey
          SLACK_WEBHOOK_URL: !Ref SlackWebhookUrl
      Events:
        SupportWebhook:
          Type: Api
          Properties:
            Path: /support/webhook
            Method: post

Outputs:
  WebhookUrl:
    Description: Configure this URL as the support ticket-created webhook target.
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/support/webhook
